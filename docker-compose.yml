services:
  redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --protected-mode no --appendonly yes
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  flask-celery-app:
    build: .
    ports:
      - "5000:5000"  # Flask应用
      - "5555:5555"  # Flower监控
    environment:
      - REDIS_HOST=redis  # 使用Docker服务名
      - FLASK_HOST=0.0.0.0
      - SERVER_IP=10.0.12.117
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  redis_data:
